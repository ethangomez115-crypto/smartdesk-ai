<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set owner password</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="wrap narrow"><section class="panel"><h1>Create your owner password</h1>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="notice {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>New password (12+ characters)<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><button class="btn">Create password and open workspace</button></form><p class="muted">This one-time setup link expires after 48 hours.</p></section></main></body></html>
