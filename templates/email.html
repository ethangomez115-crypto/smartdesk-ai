<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email draft</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="top"><a class="brand" href="/">⚡ AutoForge AI</a></header><main class="wrap narrow"><section class="panel"><small>OUTREACH DRAFT</small><h1>{{lead.name}}</h1><p class="muted">Draft only. Review before sending. Use public business contact details responsibly and honour opt-outs.</p><label>Recipient<input readonly value="{{lead.email or 'No public email listed'}}"></label><label>Subject<input readonly value="{{subject}}"></label><label>Message<textarea rows="12" readonly>{{body}}</textarea></label>{% if mailto %}<a class="btn" href="{{mailto}}">Open email app</a>{% else %}<p class="notice error">No public email listed. Do not guess an address.</p>{% endif %}<p><a href="/">Back to dashboard</a></p></section></main></body></html>
