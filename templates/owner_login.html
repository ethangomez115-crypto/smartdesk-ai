<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="wrap narrow"><section class="panel"><h1>Business owner login</h1>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="notice {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Sign in</button></form></section></main></body></html>
